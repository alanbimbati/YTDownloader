services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  ytdownloader-bot:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_USER_ID: ${ADMIN_USER_ID}
      ADMIN_CONTACT: ${ADMIN_CONTACT:-}
      BITCOIN_CHANNEL: ${BITCOIN_CHANNEL:-@BitcoinPodcastTelegram}
      AD_FREE_PRICE_SATS: ${AD_FREE_PRICE_SATS:-20000}
      AD_FREE_PAYEE: ${AD_FREE_PAYEE:-@AlanBimbati}
      API_BASE_URL: http://telegram-bot-api:8081
      DB_PATH: /data/bot_cache.sqlite3
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2146435072}
    volumes:
      - ytdownloader-data:/data

volumes:
  telegram-bot-api-data:
  ytdownloader-data:
