services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    mem_limit: ${BOT_API_MEM_LIMIT:-512m}
    memswap_limit: ${BOT_API_MEM_LIMIT:-512m}
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      # The bots hand their files over by path (file://): mounted at the same paths they write them to.
      - ytdownloader-downloads:/downloads/ytdownloader
      - ortixify-downloads:/downloads/ortixify

  # @MyYTDowbloaderbot: replaced by @OrtixifyBot, only tells its users where to go (a full copy cost ~250 MB).
  ytdownloader-bot:
    build: .
    command: ["python", "redirect_bot.py"]
    restart: unless-stopped
    mem_limit: 160m
    memswap_limit: 160m
    depends_on:
      - telegram-bot-api
    environment: &bot-env
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_USER_ID: ${ADMIN_USER_ID}
      ADMIN_CONTACT: ${ADMIN_CONTACT:-}
      BITCOIN_CHANNEL: ${BITCOIN_CHANNEL:-@BitcoinPodcastTelegram}
      AD_FREE_PRICE_SATS: ${AD_FREE_PRICE_SATS:-20000}
      AD_FREE_PAYEE: ${AD_FREE_PAYEE:-@AlanBimbati}
      API_BASE_URL: http://telegram-bot-api:8081
      DB_PATH: /data/bot_cache.sqlite3
      COOKIES_FILE: /data/cookies.txt
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2146435072}
      MOVED_TO: ${MOVED_TO:-}
      HANDOFF_DB: ${HANDOFF_DB:-}
      DOWNLOAD_DIR: /downloads/ytdownloader
      LOCAL_FILES: "1"
    volumes:
      - ytdownloader-data:/data
      - ytdownloader-downloads:/downloads/ytdownloader

  # @OrtixifyBot. Same /data volume: cookies are shared, each bot keeps its own database.
  ortixify-bot:
    build: .
    restart: unless-stopped
    # A download that runs away (ffmpeg on a long video) must kill this container, not starve the whole Pi.
    mem_limit: ${BOT_MEM_LIMIT:-1g}
    memswap_limit: ${BOT_MEM_LIMIT:-1g}
    depends_on:
      - telegram-bot-api
    profiles: ["ortixify"]
    environment:
      <<: *bot-env
      BOT_TOKEN: ${ORTIXIFY_BOT_TOKEN}
      DB_PATH: /data/ortixify.sqlite3
      BITCOIN_HUB: ${BITCOIN_HUB:-}
      MOVED_TO: ""
      HANDOFF_DB: ""
      DOWNLOAD_DIR: /downloads/ortixify
    volumes:
      - ytdownloader-data:/data
      - ortixify-downloads:/downloads/ortixify
      # Files sent to the bot (an OPML to import) are read where the local Bot API server saved them.
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro

  # Publishes the video pairs dropped in ~/Pubblica (Syncthing) once post.yaml is approved; notifies through @OrtixifyBot.
  publisher:
    build: ./publisher
    restart: unless-stopped
    mem_limit: ${PUBLISHER_MEM_LIMIT:-1200m}
    memswap_limit: ${PUBLISHER_MEM_LIMIT:-1200m}
    depends_on:
      - telegram-bot-api
    profiles: ["publisher"]
    # Same user as Syncthing, so the files written in the folder sync back and can be edited.
    user: "${PUBLISH_UID:-995}:${PUBLISH_GID:-1000}"
    environment:
      BOT_TOKEN: ${ORTIXIFY_BOT_TOKEN}
      ADMIN_USER_ID: ${ADMIN_USER_ID}
      API_BASE_URL: http://telegram-bot-api:8081
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YOUTUBE_PRIVACY: ${YOUTUBE_PRIVACY:-public}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN:-}
      LINKEDIN_TOKEN_EXPIRES_AT: ${LINKEDIN_TOKEN_EXPIRES_AT:-0}
      LINKEDIN_PERSON_URN: ${LINKEDIN_PERSON_URN:-}
      NOSTR_NSEC: ${NOSTR_NSEC:-}
      NOSTR_RELAYS: ${NOSTR_RELAYS:-wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net}
      BLOSSOM_SERVER: ${BLOSSOM_SERVER:-https://blossom.primal.net}
    volumes:
      - ${PUBLISH_HOST_DIR:-/home/dietpi/Pubblica}:/pubblica
      - publisher-data:/data

volumes:
  publisher-data:
  telegram-bot-api-data:
  ytdownloader-data:
  ytdownloader-downloads:
  ortixify-downloads:
